name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run domain tests
        run: npm test
      - name: Build single-file app
        run: npm run build
      - name: Verify offline artifact
        run: npm run check
      - name: Ensure dist is committed
        run: git diff --exit-code -- dist
