<body><h1>第1章 · 物质及其变化</h1><p>这是第二份用于烟测的完整复习资料。它属于化学学科，用于验证跨学科目录与每日第二篇阅读。</p>
<h2>物质的分类</h2><p>分类需要先确定标准，再保证同一层级使用同一标准。混合物与纯净物、单质与化合物属于不同层级。</p>
<h2>离子反应</h2><p>离子方程式只保留实际参加反应的离子，沉淀、气体、弱电解质和水需要写成化学式。</p><p>检查电荷守恒与原子守恒是书写离子方程式的基本步骤。</p>
<h2>氧化还原</h2><p>氧化还原反应的本质是电子转移，特征是元素化合价变化。氧化剂得电子，还原剂失电子。</p><p>配平时可先配平发生变价的元素，再用守恒关系补齐其他元素。</p><p>这一行位于资料末尾，滚动到这里才会触发完成记录。</p>
